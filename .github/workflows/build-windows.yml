# Builds the Jack's Jam Room installer for Windows on every push to main, using Jamulus's own build scripts
# (.github/autobuild/windows.ps1 and windows/deploy_windows.ps1). A tag such as v3.12.6-1 also publishes it as a
# GitHub release, so the site can link to .../releases/latest/download/JacksJamRoom-Setup.exe. A manual run with the
# "release" input (e.g. v3.12.6-1) does the same without pushing a tag.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the installer as this release, e.g. v3.12.6-1 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

env:
  JAMULUS_BUILD_VERSION: 3.12.6

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache Windows dependencies
        uses: actions/cache@v5
        with:
          path: |
            C:\Qt
            C:\ChocoCache
            C:\AutobuildCache
            ${{ github.workspace }}\libs\NSIS\NSIS-source
            ${{ github.workspace }}\libs\ASIOSDK2
          key: windows-${{ hashFiles('.github/workflows/build-windows.yml', '.github/autobuild/windows.ps1', 'windows/deploy_windows.ps1') }}

      - name: Fetch FlexASIO (the audio driver the installer adds when a PC has none)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows\flexasio | Out-Null
          Invoke-WebRequest -Uri https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe -OutFile windows\flexasio\FlexASIO-1.10b.exe
          $h = (Get-FileHash windows\flexasio\FlexASIO-1.10b.exe -Algorithm SHA256).Hash
          if ($h -ne 'FE496BCC08D6C421C6244C8A60AC7B538560BDA138000FD1A54AB8EBCE031209') { throw "FlexASIO checksum mismatch: $h" }

      - name: Set up build dependencies
        run: powershell .\.github\autobuild\windows.ps1 -Stage setup

      - name: Build app and installer
        run: powershell .\.github\autobuild\windows.ps1 -Stage build

      - name: Collect installer
        id: get-artifacts
        run: powershell .\.github\autobuild\windows.ps1 -Stage get-artifacts

      - name: Upload installer to this run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-artifacts.outputs.artifact_1 }}
          path: deploy/${{ steps.get-artifacts.outputs.artifact_1 }}
          retention-days: 31
          if-no-files-found: error

      # Install the fresh installer on this clean Windows machine and check that the app and a sound driver are really there.
      # (On November 11, 2026 a real PC ended up with the app and no driver, so this is checked before anything is published.)
      - name: Smoke test the installer (app installed, sound driver registered)
        shell: pwsh
        run: |
          $exe = "deploy\${{ steps.get-artifacts.outputs.artifact_1 }}"
          Write-Host "ASIO keys before:"; Get-ChildItem 'HKLM:\SOFTWARE\ASIO' -ErrorAction SilentlyContinue | ForEach-Object { $_.PSChildName }
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installer failed with code $($p.ExitCode)" }
          $app = Get-ChildItem "$env:ProgramFiles" -Directory -Filter "Jack*" | ForEach-Object { Get-ChildItem $_.FullName -Filter *.exe } | Select-Object -First 5
          $app | ForEach-Object { Write-Host "installed: $($_.FullName)" }
          if (-not $app) { throw 'the app was not installed' }
          Write-Host "ASIO keys after:"; Get-ChildItem 'HKLM:\SOFTWARE\ASIO' -ErrorAction SilentlyContinue | ForEach-Object { $_.PSChildName }
          $k = Get-ItemProperty 'HKLM:\SOFTWARE\ASIO\FlexASIO' -ErrorAction SilentlyContinue
          if (-not $k -or -not $k.CLSID) { throw 'no FlexASIO sound driver registered after the install' }
          $dll = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\CLSID\$($k.CLSID)\InprocServer32" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "FlexASIO registered: $($k.CLSID) -> $dll"
          if (-not $dll -or -not (Test-Path $dll)) { throw 'the FlexASIO driver file is missing' }

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.release || github.ref_name }}" "deploy/${{ steps.get-artifacts.outputs.artifact_1 }}" --target "${{ github.sha }}" --title "Jack's Jam Room ${{ inputs.release || github.ref_name }}" --notes "Jack's Jam Room for Windows, built on Jamulus ${{ env.JAMULUS_BUILD_VERSION }}. Source code is this repository."
